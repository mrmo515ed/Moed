function escapeHTML(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),2400)}
function routeTo(r,data=null){if(!mainRoutes.includes(r)){state.stack.push({route:state.route,data:state.data||null});}else state.stack=[];state.route=r;state.data=data;render();if(window.scrollY)window.scrollTo(0,0)}
function goBack(){if(state.stack.length){let p=state.stack.pop();state.route=p.route;state.data=p.data;render()}else routeTo('home')}

function renderCommunity(){return mainScaffold('community',`${`<div class="main-head"><div class="eyebrow">ANIME BLACK COMMUNITY</div><h1 class="h1">مجتمع الأنمي والمانجا</h1><p class="subtitle">اكتشف الأعمال والشخصيات والمجتمعات والفعاليات، وشارك في نقاشات آمنة ومنظمة.</p></div>`}<div class="search-strip"><label class="searchbox">${icon('search',16)}<input placeholder="ابحث عن أنمي، شخصية، مجتمع، فعالية أو عضو" data-action="search-input" data-route="community-search"></label></div><div class="hero"><span class="pill cyan">مساحة الاكتشاف</span><h2>اهتماماتك تقودك إلى مجتمعك</h2><p>صفحات مستقلة لكل قسم، مع أدوات بحث وفلترة ومشاركة واضحة.</p><button class="btn primary" data-action="route" data-route="community-search">ابدأ الاستكشاف ${icon('arrow',14)}</button></div><div class="chip-row">${['الكل','أتابعه','جديد','رائج','فعاليات قريبة'].map((f,i)=>`<button class="chip ${state.communityFilter===f?'active':''}" data-action="community-filter" data-filter="${f}">${f}</button>`).join('')}</div><div class="category-grid">${communitySections.map(x=>categoryTile(x[0],x[1],x[2],x[3])).join('')}</div><div class="section-head" style="margin-top:18px"><div><h2 class="section-title">مختار لك</h2><div class="section-sub">توصيات معاينة وليست بيانات مباشرة</div></div><button class="text-link" data-action="route" data-route="trending">عرض المزيد</button></div><div class="tile-list">${['ليلة نقاش مفتوح','تحدي الرسم الأسبوعي','اختيارات أعضاء المجتمع'].map((x,i)=>`<div class="tile-row" data-action="route" data-route="${['events','challenges','creators'][i]}">${cardIcon(['calendar','spark','photo'][i])}<div class="row-text"><strong>${x}</strong><small>عرض الصفحة والتفاصيل التجريبية</small></div>${icon('chevron',14)}</div>`).join('')}</div>`)}
function renderChat(){
 let chats=[['لينا','ل','رسالتها الأخيرة: شاهدت الحلقة؟','9:41 م',2,'شخصية'],['كاي','ك','أرسل لك عملًا فنيًا','8:16 م',0,'شخصية'],['نقابة نجوم الليل','ن','تحدي الأسبوع يبدأ غدًا','أمس',5,'مجموعة'],['مجتمع المانجا','م','تم تثبيت موضوع جديد','أمس',0,'مجموعة'],['قناة Anime Black','ق','إعلانات وتحديثات المنصة','11:20 ص',0,'قناة']];
 let filtered=chats.filter(c=>state.archivedChats.includes(c[0])?false:(state.chatFilter==='الكل'||state.chatFilter===c[5]||(state.chatFilter==='غير مقروءة'&&c[4])||(state.chatFilter==='مثبتة'&&state.pinnedChats.includes(c[0])))).sort((a,b)=>Number(state.pinnedChats.includes(b[0]))-Number(state.pinnedChats.includes(a[0])));
 return mainScaffold('chat',`<div class="main-head row spread"><div><div class="eyebrow">MESSAGES</div><h1 class="h1">الدردشة</h1><p class="subtitle">محادثاتك الفردية والجماعية في مكان واحد.</p></div><div class="row"><button class="icon-button" data-action="route" data-route="message-requests" aria-label="طلبات الرسائل" title="طلبات الرسائل">${icon('users',16)}</button><button class="icon-button" data-action="route" data-route="chat-archive" aria-label="المحادثات المؤرشفة" title="الأرشيف">${icon('archive',16)}</button><button class="icon-button" data-action="route" data-route="chat-settings" aria-label="إعدادات الدردشة" title="الإعدادات">${icon('settings',16)}</button><button class="icon-button accent" data-action="route" data-route="new-chat" aria-label="رسالة جديدة" title="رسالة جديدة">${icon('plus',16)}</button></div></div>
 <div class="search-strip"><label class="searchbox">${icon('search',16)}<input placeholder="ابحث في المحادثات" oninput="searchChat(this.value)"></label></div>
 <div class="chip-row">${['الكل','غير مقروءة','مثبتة','شخصية','مجموعة','قناة'].map(f=>`<button class="chip ${state.chatFilter===f?'active':''}" data-action="chat-filter" data-filter="${f}">${f}</button>`).join('')}</div>
 <div class="chat-list" id="chat-list">${filtered.length?filtered.map((c,i)=>`<div class="chat-row" data-action="chat-open" data-name="${c[0]}" data-id="c${i}"><div class="chat-avatar">${c[1]}</div><div class="chat-info"><strong>${c[0]} <span class="pill">${c[5]}</span>${state.pinnedChats.includes(c[0])?`<span class="pin-mark">${icon('pin',11)}</span>`:''}</strong><small>${state.mutedChats[c[0]]?'مكتومة · ':''}${c[2]}</small></div><div class="chat-time">${c[3]}${c[4]?`<div style="margin-top:5px;text-align:end"><span class="unread-count">${c[4]}</span></div>`:''}</div><button class="icon-button chat-more" data-action="chat-menu" data-name="${c[0]}" aria-label="خيارات المحادثة">${icon('more',14)}</button></div>`).join(''):`<div class="empty"><strong>لا توجد محادثات في هذا الفلتر</strong><p>ابدأ محادثة جديدة أو غيّر الفلتر.</p><button class="btn primary" data-action="route" data-route="new-chat">بدء محادثة</button></div>`}</div>
`)
}
function searchChat(q){document.querySelectorAll('#chat-list .chat-row').forEach(e=>e.style.display=e.innerText.toLowerCase().includes(q.toLowerCase())?'flex':'none')}
function filterArchive(q){document.querySelectorAll('#archive-list [data-archive-name]').forEach(e=>e.style.display=e.dataset.archiveName.toLowerCase().includes(q.toLowerCase())?'flex':'none')}
function filterChatMessages(q){let box=document.getElementById('chat-search-results');if(!box)return;let msgs=currentChatMessages().filter(m=>!q||m.text.toLowerCase().includes(q.toLowerCase()));box.innerHTML=msgs.length?msgs.map(m=>`<div class="list-row">${cardIcon(m.mine?'send':'chat')}<div class="row-text"><strong>${escapeHTML(m.text)}</strong><small>${m.time} · ${m.mine?'أنت':'الطرف الآخر'}</small></div></div>`).join(''):`<div class="empty"><strong>لا توجد نتائج</strong><p>جرّب كلمة بحث أخرى.</p></div>`}

function renderProfile(){let visitor=state.profileVisitor;let names=[['posts','المنشورات'],['replies','النقاشات'],['media','الوسائط'],['reviews','المراجعات'],['lists','القوائم'],['achievements','الشارات']];let body=state.profileTab==='posts'?posts.slice(0,2).map((p,i)=>`<article class="post"><div class="post-head">${avatar(visitor?'ر':'م')}<div><div class="post-author">${visitor?'رين ك.':'ميرا ن.'}</div><div class="post-meta">منذ ${i+1} أيام · ${p.tag}</div></div></div><p class="post-copy">${p.text}</p><button class="text-link" data-action="route" data-route="discussion-thread">فتح النقاش</button></article>`).join(''):state.profileTab==='achievements'?`<div class="tile-list">${['مشارك مجتمعي','قارئ فضولي','مساهم في النقاش'].map((x,i)=>`<div class="badge-item">${cardIcon('trophy',i===1?'gold':'purple')}<div class="row-text"><strong>${x}</strong><small>شارة معاينة فقط · لا تمثل استحقاقًا فعليًا</small></div></div>`).join('')}</div>`:`<div class="empty">${cardIcon(state.profileTab==='media'?'photo':state.profileTab==='lists'?'book':'chat')}<strong>لا يوجد محتوى عام في هذا القسم بعد</strong><p>المحفوظات والمسودات خاصة بصاحب الحساب، ولا تظهر للزوار.</p></div>`;return screen(visitor?'ملف المستخدم':'الملف الشخصي',`<section class="card" style="margin-top:12px"><div class="profile-cover"></div><div class="profile-body"><div class="profile-avatar-wrap"><div class="profile-avatar">${visitor?'ر':'م'}</div><div class="profile-actions">${visitor?`<button class="btn ${state.following[visitor]?'soft':'primary'}" data-action="follow">${state.following[visitor]?'متابَع':'متابعة'}</button><button class="btn" data-action="route" data-route="chat-room">${icon('chat',15)} رسالة</button>`:`<button class="btn primary" data-action="route" data-route="edit-profile">تعديل الملف</button>`}<button class="icon-button" data-action="profile-menu">${icon('more',16)}</button></div></div><div class="profile-name">${visitor?'رين ك.':'ميرا ن.'} <span class="pill cyan">عضو</span></div><div class="profile-handle">@${visitor?'rin_k':'mira_nova'}</div><p class="profile-bio">${visitor?'أحب النقاشات الهادئة حول القصص والشخصيات.':'أحب عوالم الخيال، وأشارك قوائم المشاهدة والاكتشافات.'}</p><div class="small-note">انضم في 2024 · الاهتمامات العامة: خيال، مغامرة</div><div class="profile-stats"><div class="profile-stat" data-action="route" data-route="profile-posts"><b>24</b><span>منشور</span></div><div class="profile-stat" data-action="route" data-route="followers"><b>1.2k</b><span>متابع</span></div><div class="profile-stat" data-action="route" data-route="following"><b>318</b><span>أتابع</span></div><div class="profile-stat" data-action="route" data-route="reviews"><b>12</b><span>مراجعة</span></div></div></div><div class="tabs">${names.map(([id,n])=>`<button class="${state.profileTab===id?'active':''}" data-action="profile-tab" data-tab="${id}">${n}</button>`).join('')}</div><div style="padding:12px 0">${body}</div></section><div class="notice">${icon('shield')}<span>الشارات والإحصاءات بيانات توضيحية. المحتوى الخاص لا يظهر لزوار الملف.</span></div>`, `<button class="page-header-action" data-action="toggle-profile-mode">${visitor?'عرض ملفي':'معاينة الزائر'}</button>`)}

function renderCreatePost(){return screen('إنشاء منشور',`<div class="form-card" style="margin-top:12px"><div class="segmented">${['عام','مراجعة','استطلاع','نظرية'].map(x=>`<button class="${state.selectedPostType===x?'active':''}" data-action="post-type" data-type="${x}">${x}</button>`).join('')}</div><div class="field"><label>نص المنشور</label><textarea class="textarea" id="post-text" maxlength="2000" placeholder="شارك رأيك أو اكتشافك مع المجتمع"></textarea><div class="hint">حتى 2000 حرف</div></div><div id="post-type-fields">${state.selectedPostType==='استطلاع'?`<div class="field"><label>خيارات الاستطلاع</label><input class="input" placeholder="الخيار الأول"><input class="input" style="margin-top:7px" placeholder="الخيار الثاني"><button class="text-link" data-action="add-poll-option">إضافة خيار</button></div>`:state.selectedPostType==='مراجعة'?`<div class="field"><label>التقييم من 10</label><input class="input" type="range" min="1" max="10" step="0.5" value="8" id="review-score"><div class="hint">التقييم: <span id="score-value">8</span> / 10</div></div>`:''}</div><div class="field"><label>ربط بعمل (اختياري)</label><select class="select"><option>بدون ربط عمل</option><option>عمل من قائمة الأنمي</option><option>عمل من قائمة المانجا</option></select></div><div class="row wrap"><button class="btn" data-action="attach">${icon('photo',15)} صورة أو فيديو</button><button class="btn" data-action="attach">${icon('book',15)} ملف</button><button class="btn" data-action="attach">${icon('filter',15)} استطلاع</button></div><div class="list" style="margin-top:12px">${settingToggle('post-spoiler','يتضمن حرقًا','أخفِ التفاصيل حتى يختار القارئ إظهارها',false)}</div><div class="field"><label>من يمكنه رؤية المنشور؟</label><select class="select"><option>عام</option><option>المتابعون</option><option>أنا فقط - مسودة</option></select></div><button class="btn primary block" style="margin-top:8px" data-action="publish">نشر للمعاينة</button><div class="small-note" style="margin-top:10px">النشر function renderCreateGroup(){return screen('إنشاء مجموعة',`<div class="form-card" style="margin-top:12px"><div class="field"><label>اسم المجموعة</label><input class="input" id="group-name" placeholder="اسم واضح ومميز"></div><div class="field"><label>الوصف والقواعد</label><textarea class="textarea" placeholder="ما موضوع المجموعة؟ أضف قواعد المشاركة."></textarea></div><button class="btn" data-action="upload-cover">${icon('photo',15)} إضافة صورة للمجموعة</button><div class="divider"></div><h3 style="font-size:11px">إضافة أعضاء</h3>${['لينا','كاي','هانا ر.'].map(x=>`<div class="list-row" data-action="select-member">${avatar(x)}<div class="row-text"><strong>${x}</strong><small>عضو</small></div><span class="toggle"></span></div>`).join('')}${settingToggle('group-private','مجموعة خاصة','الدخول عبر دعوة أو موافقة المشرف',false)}${settingToggle('group-admin-add','المشرفون يضيفون الأعضاء','تطبيق الصلاحيات عبر الخادم',true)}<button class="btn primary block" style="margin-top:14px" data-action="create-group">إنشاء معاينة المجموعة</button></div>`)}

function currentChatMessages(){let id=state.chatId||'lina';return state.chatMessages[id]||[{mine:false,text:'أهلًا، هل شاهدت الحلقة الجديدة؟',time:'9:34'},{mine:true,text:'نعم، النهاية كانت مفاجئة فعلًا.',time:'9:38'},{mine:false,text:'لنناقشها من دون حرق هنا.',time:'9:41'}]}
function renderChatRoom(){let msgs=currentChatMessages();return `<div class="chat-page"><div class="chat-page-head"><button class="page-back" data-action="back">${icon('back')}</button><div class="chat-avatar">${(state.chatName||'ل')[0]}</div><div class="row-text"><strong style="font-size:11px">${escapeHTML(state.chatName||'لينا')}</strong><small>حالة الاتصال وفق إعدادات الخصوصية</small></div><button class="icon-button" data-action="route" data-route="chat-search" aria-label="بحث في المحادثة">${icon('search',15)}</button><button class="icon-button" data-action="call">${icon('phone',15)}</button><button class="icon-button" data-action="route" data-route="conversation-options" aria-label="إعدادات المحادثة">${icon('settings',15)}</button></div>${state.settings.pinnedMessage?`<button class="pinned-message-bar" data-action="route" data-route="pinned-messages">${icon('pin',14)} رسالة مثبتة · ${escapeHTML(state.settings.pinnedMessage)}</button>`:''}<div class="chat-scroll" id="chat-messages"><div class="chat-date">اليوم</div>${msgs.map((m,index)=>`<div class="bubble ${m.mine?'mine':''}"><span>${escapeHTML(m.text)}</span><button class="message-menu-button" data-action="message-menu" data-index="${index}" aria-label="خيارات الرسالة">${icon('more',12)}</button><small>${m.time}${m.mine?' · أُرسلت للمعاينة':''}</small></div>`).join('')}</div><div class="notice" style="margin:0 11px 6px">${icon('shield')}<span>رسالة معاينة محلية، غير مرسلة لمستخدم حقيقي.</span></div>${state.replyDraft?`<div class="reply-preview">${icon('chat',14)}<span>${escapeHTML(state.replyDraft)}</span><button data-action="clear-reply">${icon('close',13)}</button></div>`:''}<div class="composer"><button class="icon-button" data-action="route" data-route="attachment-picker" aria-label="المرفقات">${icon('plus',17)}</button><textarea id="chat-input" rows="1" placeholder="اكتب رسالة">${escapeHTML(state.replyDraft?`رد: ${state.replyDraft} — `:'')}</textarea><button class="icon-button" data-action="voice" aria-lab function renderAuthFlow(route){if(!['welcome','sign-in','sign-up','password-reset','guest-mode'].includes(route))return null;if(route==='guest-mode')return screen('وضع الزائر',`<div class="hero" style="margin:12px 0"><span class="pill cyan">تصفح محدود</span><h2>أهلًا بك في Anime Black</h2><p>يمكنك استكشاف الصفحات العامة. المتابعة والحفظ والمراسلة تتطلب حسابًا وتسجيل دخول.</p><button class="btn primary" data-action="tab" data-route="home">استكشف الرئيسية</button></div><div class="section-list">${routeRow('sign-in','تسجيل الدخول','لديك حساب بالفعل؟','user')}${routeRow('sign-up','إنشاء حساب','ابدأ ملفًا جديدًا','plus')}</div>`);let title=route==='welcome'?'مرحبًا بك':route==='sign-in'?'تسجيل الدخول':route==='sign-up'?'إنشاء حساب':'استعادة كلمة المرور';return screen(title,`<div class="form-card" style="margin-top:18px;text-align:center">${brandMark()}<h2 style="font-size:17px;margin:8px 0">${title}</h2><p class="subtitle">${route==='welcome'?'انضم إلى مجتمع الأنمي والمانجا.':route==='sign-up'?'أنشئ حسابك وخصص ملفك.':'أدخل بيانات حسابك للمتابعة.'}</p>${route==='welcome'?`<div class="row" style="flex-direction:column;margin-top:17px"><button class="btn primary block" data-action="route" data-route="sign-in">تسجيل الدخول</button><button class="btn block" data-action="route" data-route="sign-up">إنشاء حساب</button><button class="text-link" data-action="route" data-route="guest-mode">المتابعة كزائر</button></div>`:`<div class="field" style="text-align:start"><label>${route==='password-reset'?'البريد الإلكتروني':'البريد الإلكتروني أو اسم المستخدم'}</label><input class="input" id="auth-user" autocomplete="username" placeholder="name@example.com"></div>${route!=='password-reset'?`<div class="field" style="text-align:start"><label>كلمة المرور</label><input class="input" id="auth-pass" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور"></div>`:''}${route==='sign-up'?`<div class="field" style="text-align:start"><label>اسم المستخدم</label><input class="input" id="auth-handle" placeholder="اسم مستخدم فريد"></div><div class="small-note" style="text-align:start">بإنشاء الحساب، توافق على شروط الاستخدام وسياسة الخصوصية.</div>`:''}<button class="btn primary block" style="margin-top:12px" data-action="auth-submit" data-route="${route}">${route==='password-reset'?'إرسال رابط الاستعادة':route==='sign-up'?'إنشاء الحساب':'تسجيل الدخول'}</button>${route==='sign-in'?`<button class="text-link" data-action="route" data-route="password-reset">نسيت كلمة المرور؟</button>`:''}<div class="divider"></div><button class="btn block" data-action="route" data-route="${route==='sign-up'?'sign-in':'sign-up'}">${route==='sign-up'?'لدي حساب بالفعل':'إنشاء حساب جديد'}</button>`}<div class="notice" style="margin:14px 0 0;text-align:start">${icon('shield')}<span>نموذج توضيحي فقط. لا تُرسل بيانات الدخول ولا تحفظ كلمات المرور.</span></div></div>`)}

function handleAction(el){const a=el.dataset.action,route=el.dataset.route;if(a==='tab'){state.stack=[];state.route=route;render();return}if(a==='route'){if(route==='chat-room'&&!state.chatName)state.chatName='لينا';if(route==='chat-room'&&el.dataset.name)state.chatName=el.dataset.name;if(route==='community-detail')state.data={name:el.dataset.name||'مجتمع'};routeTo(route);return}if(a==='back'){goBack();return}if(a==='toggle'){let key=el.dataset.key;state.settings[key]=!state.settings[key];let t=el.querySelector('.toggle');if(t)t.classList.toggle('on',state.settings[key]);return}if(a==='collapse'){document.getElementById('statusCard')?.classList.toggle('collapsed');return}if(a==='story'){showStory(+el.dataset.index);return}if(a==='story-next'){if((state.storyIndex||0)>=4)goBack();else{state.storyIndex=(state.storyIndex||0)+1;render()}return}if(a==='story-reply'){let t=document.getElementById('story-reply')?.value.trim();if(!t){toast('اكتب ردًا قبل الإرسال');return}toast('الرد خاص بالمعاينة فقط؛ لا يتم إرساله فعليًا');return}if(a==='spoiler'){el.classList.toggle('revealed');return}if(a==='filter-feed'){state.feedFilter=el.dataset.filter;render();return}if(a==='community-filter'){state.communityFilter=el.dataset.filter;el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');return}if(a==='chat-filter'){state.chatFilter=el.dataset.filter;render();return}if(a==='like'){state.postLikes[el.dataset.id]=!state.postLikes[el.dataset.id];render();return}if(a==='save'){state.postSaved[el.dataset.id]=!state.postSaved[el.dataset.id];toast(state.postSaved[el.dataset.id]?'حُفظ للمعاينة':'أزيل من المحفوظات');if(state.route==='home')render();return}if(a==='share'){toast('رابط المعاينة جاهز للمشاركة');return}if(a==='report'){routeTo('report');return}if(a==='post-menu'){openPostMenu(el.dataset.id);return}if(a==='join'){let n=el.dataset.name;state.joined[n]=!state.joined[n];toast(state.joined[n]?'تم الانضمام في المعاينة':'تمت المغادر function abRenderReaderSettings(){return screen('إعدادات القارئ',`<div class="form-card" style="margin-top:12px"><h3 style="font-size:12px;margin:0 0 10px">طريقة القراءة</h3><div class="section-list">${[['reader-direction','اتجاه الصفحات','من اليمين إلى اليسار'],['reader-fit','ملاءمة الشاشة','عرض الصفحة أو احتواء الارتفاع'],['reader-preload','التحميل المسبق','فصل واحد في كل مرة لتقليل البيانات']].map(([k,t,d])=>settingToggle(k,t,d,state.settings[k]!==false)).join('')}</div><div class="field"><label>حجم العرض</label><input type="range" min="80" max="120" step="5" value="${Math.round((state.ab.readerScale||1)*100)}" id="ab-reader-scale" data-action="ab-reader-scale" style="width:100%;accent-color:var(--cyan)"><div class="hint">${Math.round((state.ab.readerScale||1)*100)}%</div></div><div class="row wrap"><button class="btn" data-action="ab-reader-reset">إعادة الضبط</button><button class="btn primary" data-action="route" data-route="reader">العودة للقارئ</button></div></div><div class="notice">${icon('book')}<span>تفضيلات القارئ تحفظ داخل المعاينة فقط؛ التطبيق الأصلي يحتاج تخزينًا محليًا للتفضيلات وملفاتًا مرخّصة.</span></div>`)}

function abRenderDiscussionThread(){const p=posts.find(x=>x.id===(state.data?.postId||''))||posts[0];const replies=(state.ab.threadReplies&&state.ab.threadReplies[p.id])||[];return screen('النقاش والتعليقات',`<article class="post" style="margin:12px 0"><div class="post-head">${avatar(p.name)}<div><div class="post-author">${abEsc(p.name)} <span class="pill cyan">${abEsc(p.tag)}</span></div><div class="post-meta">${abEsc(p.handle)} · ${abEsc(p.time)}</div></div></div><p class="post-copy">${abEsc(p.text)}</p><div class="post-actions"><button data-action="like" data-id="${p.id}" class="${state.postLikes[p.id]?'selected':''}">${icon('heart',14)} إعجاب ${state.postLikes[p.id]?'✓':''}</button><button data-action="save" data-id="${p.id}">${icon('bookmark',14)} ${state.postSaved[p.id]?'محفوظ':'حفظ'}</button><button data-action="share">${icon('share',14)} مشاركة</button><button data-action="report">${icon('flag',14)} إبلاغ</button></div></article><div class="section-head" style="padding:0 0 8px"><div><h2 class="section-title">التعليقات والردود</h2><div class="section-sub">${replies.length} رد محلي</div></div></div><div class="section-list">${replies.length?replies.map(r=>`<div class="list-row">${avatar('م')}<div class="row-text"><strong>${abEsc(r.name||'ميرا ن.')}</strong><small>${abEsc(r.text)}</small></div><span class="small-note">الآن</span></div>`).join(''):`<div class="ab-empty-state">ابدأ النقاش برد محترم، وتجنب الحرق من دون تحذير.</div>`}</div><div class="form-card" style="margin-top:12px"><div class="field"><label>اكتب ردك</label><textarea class="textarea" id="ab-thread-reply" maxlength="1000" placeholder="أضف رأيك أو اسأل سؤالًا..."></textarea></div><button class="btn primary block" data-action="ab-thread-reply-submit" data-id="${p.id}">إضافة الرد للمعاينة</button></div><div class="notice">${icon('shield')}<span>التعليقات هنا محفوظة محليًا في نموذجك فقط؛ الإبلاغ والإشراف والمزامنة تحتاج خادمًا حقيقيًا.</span></div>`)}

 if(a==='share'){const shareText='Anime Black — عالم الأنمي الاجتماعي';modal('مشاركة Anime Black',`<p>هذه معاينة محلية وليست رابطًا عامًا منشورًا.</p><div class="field"><label>نص المشاركة</label><textarea class="textarea" id="ab-share-text">${shareText}</textarea></div><div class="modal-actions"><button class="btn" data-action="close-modal">إلغاء</button><button class="btn primary" data-action="ab-copy-share">نسخ النص</button></div>`);return}
