name: Android APK

on:
  push:
    branches:
      - arena/8b833e7d-moed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      - name: Publish actionable build errors
        if: ${{ failure() }}
        run: |
          if [ -f gradle-build.log ]; then
            grep -E '(^e: |^w: |^FAILURE:|What went wrong:|Execution failed)' gradle-build.log | tail -n 80 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-black-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'publish_apk_v0.2.0') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: ${{ github.sha }}
          name: Anime Black Android v0.2.0
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
